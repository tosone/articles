<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Articles</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="文章列表">
        <header class="brand">
          <p>Engineering Notes</p>
          <h1>Articles</h1>
        </header>
        <nav id="article-list" class="article-list"></nav>
      </aside>

      <section class="reader" aria-live="polite">
        <div id="cover-wrap" class="cover-wrap"></div>
        <article id="content" class="markdown markdown-body">
          <p class="loading">正在加载文章...</p>
        </article>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
