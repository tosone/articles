<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000" role="img" aria-label="Go 1.28 路线图新特性梳理文章封面">
  <defs>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito Variable";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#edfaff"/>
      <stop offset="1" stop-color="#f5f2e9"/>
    </linearGradient>
    <linearGradient id="cyanInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#12c7b8"/>
    </linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#00add8" stroke-width="1.2" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="2350" height="1000" fill="url(#paper)"/>
  <rect width="2350" height="1000" fill="url(#grid)"/>

  <g opacity="0.56">
    <path d="M -90 706 C 320 540, 590 786, 960 632 S 1580 402, 2440 546" fill="none" stroke="#00add8" stroke-width="32" stroke-linecap="round" opacity="0.13"/>
    <path d="M -72 772 C 360 626, 620 852, 990 712 S 1604 476, 2418 636" fill="none" stroke="#12c7b8" stroke-width="16" stroke-linecap="round" opacity="0.2"/>
  </g>

  <g transform="translate(1180 176)">
    <rect x="0" y="0" width="1000" height="650" rx="28" fill="#ffffff" stroke="#b7e8f2" stroke-width="3"/>

    <text x="56" y="84" fill="#007d9c" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="26" font-weight="800" letter-spacing="0">GO 1.28 · ROADMAP</text>
    <line x1="56" y1="112" x2="944" y2="112" stroke="#e2f2f6" stroke-width="2"/>

    <g>
      <rect x="56" y="144" width="888" height="132" rx="24" fill="#e8f9fe"/>
      <rect x="84" y="182" width="56" height="56" rx="16" fill="#00add8"/>
      <text x="112" y="220" text-anchor="middle" fill="#ffffff" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="30" font-weight="900" letter-spacing="0">C</text>
      <text x="168" y="202" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="32" font-weight="850" letter-spacing="0">Cgo without C toolchain</text>
      <text x="168" y="242" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="650" letter-spacing="0">binding 文件取代 C 编译器，预编译库免工具链</text>
      <rect x="764" y="190" width="148" height="40" rx="20" fill="#fde7bd"/>
      <text x="838" y="216" text-anchor="middle" fill="#a9741a" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="800" letter-spacing="0">提案</text>
    </g>

    <g>
      <rect x="56" y="294" width="888" height="132" rx="24" fill="#dff8fd"/>
      <rect x="84" y="332" width="56" height="56" rx="16" fill="#12c7b8"/>
      <text x="112" y="370" text-anchor="middle" fill="#ffffff" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="30" font-weight="900" letter-spacing="0">G</text>
      <text x="168" y="352" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="32" font-weight="850" letter-spacing="0">Green Tea GC default</text>
      <text x="168" y="392" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="650" letter-spacing="0">暂停分布整体下移，sync.Pool 命中率需回归</text>
      <rect x="764" y="340" width="148" height="40" rx="20" fill="#c9f3ee"/>
      <text x="838" y="366" text-anchor="middle" fill="#0f7f76" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="800" letter-spacing="0">转默认</text>
    </g>

    <g>
      <rect x="56" y="444" width="888" height="132" rx="24" fill="#fdf4e2"/>
      <rect x="84" y="482" width="56" height="56" rx="16" fill="#f6b73c"/>
      <text x="112" y="520" text-anchor="middle" fill="#ffffff" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="30" font-weight="900" letter-spacing="0">T</text>
      <text x="168" y="502" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="32" font-weight="850" letter-spacing="0">slices / maps v2 + Set</text>
      <text x="168" y="542" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="650" letter-spacing="0">泛型容器进入标准库，减少重复工具代码</text>
      <rect x="764" y="490" width="148" height="40" rx="20" fill="#fde7bd"/>
      <text x="838" y="516" text-anchor="middle" fill="#a9741a" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="22" font-weight="800" letter-spacing="0">提案</text>
    </g>

    <text x="56" y="622" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="23" font-weight="650" letter-spacing="0">路线图不等于 release notes，落地形态以正式版本为准</text>
  </g>

  <g transform="translate(170 178)">
    <text x="0" y="0" fill="#007d9c" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="34" font-weight="800" letter-spacing="0">GO 1.28</text>
    <text x="0" y="150" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="112" font-weight="900" letter-spacing="0">Go 1.28 Roadmap</text>
    <text x="0" y="262" fill="#12313d" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="62" font-weight="850" letter-spacing="0">路线图新特性梳理</text>
  </g>

  <g transform="translate(170 526)" opacity="0.92">
    <path d="M 0 0 H 376" stroke="url(#cyanInk)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g>
    <text x="170" y="612" fill="#0b2533" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="31" font-weight="600" letter-spacing="0">cgo · slices v2 · greentea</text>
    <text x="170" y="658" fill="#5b6f79" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="500" letter-spacing="0">no C toolchain · generic containers</text>
  </g>

  <g transform="translate(1096 760)" opacity="0.4">
    <circle cx="0" cy="0" r="58" fill="#f6b73c"/>
  </g>
  <g transform="translate(1112 230)" opacity="0.26">
    <circle cx="0" cy="0" r="46" fill="#12c7b8"/>
  </g>
</svg>
