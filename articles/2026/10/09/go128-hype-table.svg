<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="399" viewBox="0 0 1620 399" role="img"
  aria-label="Go 1.28 容易被高估的变化">
  <foreignObject width="1620" height="399">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: #ffffff; }
        table {
          width: 1620px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.38;
          color: #173642;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
        }
        th {
          background: #00add8;
          color: #ffffff;
          font-weight: 700;
        }
        td { font-weight: 400; }
        td:first-child { color: #0b2533; font-weight: 600; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 4px;
        }
        .nowrap { white-space: nowrap; }
      </style>
      <table>
        <colgroup>
          <col style="width: 420px" />
          <col style="width: 740px" />
          <col style="width: 460px" />
        </colgroup>
        <thead>
          <tr>
            <th>常见说法</th>
            <th>更准确的理解</th>
            <th>建议动作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>“cgo 要消失了”</td>
            <td>提案 #81450 只覆盖“调用预编译库”这条路径，含 C 源码或 C++ 的包依然需要 C 编译器</td>
            <td>先盘点用途，别急着删 <code>import "C"</code></td>
          </tr>
          <tr>
            <td>“loopvar 是 1.28 新特性”</td>
            <td>循环变量按迭代捕获从 Go 1.22 起就是默认语义，1.28 更可能是清理剩余开关</td>
            <td>老代码升级时仍然要跑并发相关测试</td>
          </tr>
          <tr>
            <td>“<code>runtime.Free</code> 可以替代 GC”</td>
            <td>手动释放内存几乎必然引入 use-after-free，官方并不推荐普通业务代码使用</td>
            <td>除非有明确文档和审查，不要用在生产路径</td>
          </tr>
          <tr>
            <td>“PGO 2.0 能白拿 15% 性能”</td>
            <td>收益高度依赖调用热点是否稳定，benchmark 数字不等于你的服务</td>
            <td>先建 baseline，再决定是否接入</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
