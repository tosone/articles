<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="489" viewBox="0 0 1520 489" role="img"
  aria-label="Go 1.28 路线图关键方向对照表">
  <foreignObject width="1520" height="489">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: #ffffff; }
        table {
          width: 1520px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.38;
          color: #173642;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
        }
        th {
          background: #00add8;
          color: #ffffff;
          font-weight: 700;
        }
        td { font-weight: 400; }
        td:first-child { color: #0b2533; font-weight: 600; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 4px;
        }
        .nowrap { white-space: nowrap; }
      </style>
      <table>
        <colgroup>
          <col style="width: 170px" />
          <col style="width: 180px" />
          <col style="width: 590px" />
          <col style="width: 580px" />
        </colgroup>
        <thead>
          <tr>
            <th>方向</th>
            <th>当前状态</th>
            <th>1.28 的计划</th>
            <th>现在就该做的事</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Cgo</td>
            <td>提案 #81450</td>
            <td>用 binding 文件描述 C API，调用预编译库时不再需要 C 编译器</td>
            <td>盘点 cgo 依赖：只调预编译库，还是含 C/C++ 源码</td>
          </tr>
          <tr>
            <td>GC</td>
            <td>实验转默认</td>
            <td>Green Tea GC 从 opt-in 变成默认行为</td>
            <td>建立 GC 暂停分布基线，别等升级后才看监控告警</td>
          </tr>
          <tr>
            <td>标准库容器</td>
            <td>提案</td>
            <td><code>slices</code> / <code>maps</code> 扩充，泛型 <code>Set</code> 进入标准库</td>
            <td>先别删三方库，等 API 形态稳定再迁移</td>
          </tr>
          <tr>
            <td>JSON</td>
            <td>1.27 引入</td>
            <td><code>encoding/json/v2</code> 走向稳定</td>
            <td>回归未知字段、错误文本、字段顺序相关测试</td>
          </tr>
          <tr>
            <td>计算性能</td>
            <td>实验</td>
            <td>SIMD、PGO 2.0、分片计数器继续推进</td>
            <td>先有 benchmark，再决定是否依赖实验特性</td>
          </tr>
          <tr>
            <td>工具链</td>
            <td>提案</td>
            <td>export data 二进制化、Wasm 栈切换、Typed Struct Tags</td>
            <td>关注首次编译时间和 CI 缓存命中，别只看功能</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
