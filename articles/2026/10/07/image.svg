<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000" role="img" aria-label="Kubernetes CPU limits article cover">
  <defs>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito Variable";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.58" stop-color="#edfaff"/>
      <stop offset="1" stop-color="#f5f2e9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#12c7b8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde7bd"/>
      <stop offset="1" stop-color="#f8d38b"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#8ac9d8" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="2350" height="1000" fill="url(#paper)"/>
  <rect width="2350" height="1000" fill="url(#grid)"/>

  <g transform="translate(170 186)">
    <rect x="0" y="0" width="320" height="58" rx="0" fill="#f6b73c"/>
    <text x="160" y="39" text-anchor="middle" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="28" font-weight="900" letter-spacing="0">KUBERNETES</text>

    <text x="0" y="196" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="128" font-weight="900" letter-spacing="0">CPU Limits</text>
    <text x="4" y="306" fill="#12313d" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="92" font-weight="850" letter-spacing="0">该不该设</text>
    <text x="4" y="392" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="33" font-weight="600" letter-spacing="0">CFS throttling / noisy neighbor / QoS trade-offs</text>
  </g>

  <g transform="translate(170 726)">
    <rect x="0" y="0" width="900" height="112" rx="26" fill="#ffffff" stroke="#b7e8f2" stroke-width="2"/>
    <text x="40" y="47" fill="#007d9c" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="800" letter-spacing="0">requests.cpu: "1"   limits.cpu: "500m"</text>
    <text x="40" y="82" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="650" letter-spacing="0">requests 保底，limits 决定隔离与延迟</text>
  </g>

  <g transform="translate(1180 200)">
    <rect x="0" y="0" width="1000" height="600" rx="28" fill="#ffffff" stroke="#b7e8f2" stroke-width="3"/>

    <text x="52" y="80" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="36" font-weight="900" letter-spacing="0">CFS period = 100ms</text>

    <rect x="52" y="132" width="896" height="100" rx="24" fill="#eef8fb" stroke="#cfeef5" stroke-width="2"/>
    <rect x="52" y="132" width="370" height="100" rx="24" fill="url(#cyan)"/>
    <text x="237" y="193" text-anchor="middle" fill="#ffffff" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="30" font-weight="850" letter-spacing="0">50ms quota</text>

    <rect x="422" y="132" width="526" height="100" rx="24" fill="url(#amber)"/>
    <rect x="616" y="167" width="14" height="32" rx="4" fill="#d99a24"/>
    <rect x="644" y="167" width="14" height="32" rx="4" fill="#d99a24"/>
    <text x="692" y="193" fill="#a9741a" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="30" font-weight="850" letter-spacing="0">throttled</text>

    <text x="52" y="272" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="650" letter-spacing="0">0ms</text>
    <text x="948" y="272" text-anchor="end" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="650" letter-spacing="0">100ms</text>

    <line x1="52" y1="322" x2="948" y2="322" stroke="#e2f2f6" stroke-width="2"/>

    <circle cx="66" cy="386" r="11" fill="#00add8"/>
    <text x="96" y="396" fill="#007d9c" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="800" letter-spacing="0">requests.cpu = 1</text>
    <text x="96" y="436" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="650" letter-spacing="0">guaranteed base share</text>

    <circle cx="66" cy="502" r="11" fill="#f6b73c"/>
    <text x="96" y="512" fill="#a9741a" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="800" letter-spacing="0">limits.cpu = 500m</text>
    <text x="96" y="552" fill="#5b6f79" font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="24" font-weight="650" letter-spacing="0">hard cap → throttled tail latency</text>
  </g>
</svg>
