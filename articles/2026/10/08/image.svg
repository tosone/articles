<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000" role="img" aria-label="现代化 Dockerfile 编写指南文章封面">
  <defs>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito Variable";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#edfaff"/>
      <stop offset="1" stop-color="#f5f2e9"/>
    </linearGradient>
    <linearGradient id="cyanInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#12c7b8"/>
    </linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#00add8" stroke-width="1.2" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="2350" height="1000" fill="url(#paper)"/>
  <rect width="2350" height="1000" fill="url(#grid)"/>

  <g opacity="0.56">
    <path d="M -90 706 C 320 540, 590 786, 960 632 S 1580 402, 2440 546" fill="none" stroke="#00add8" stroke-width="32" stroke-linecap="round" opacity="0.13"/>
    <path d="M -72 772 C 360 626, 620 852, 990 712 S 1604 476, 2418 636" fill="none" stroke="#12c7b8" stroke-width="16" stroke-linecap="round" opacity="0.2"/>
  </g>

  <g transform="translate(1420 130)">
    <rect x="280" y="0" width="600" height="104" rx="26" fill="#e8f9fe"/>
    <rect x="280" y="142" width="600" height="104" rx="26" fill="#c9eefb"/>
    <rect x="280" y="284" width="600" height="104" rx="26" fill="#9de0f2"/>
    <rect x="280" y="426" width="600" height="104" rx="26" fill="#00add8"/>
    <rect x="322" y="462" width="516" height="32" rx="16" fill="#e8f9fe" opacity="0.45"/>

    <rect x="6" y="196" width="208" height="150" fill="#12c7b8"/>
    <ellipse cx="110" cy="346" rx="104" ry="34" fill="#12c7b8"/>
    <ellipse cx="110" cy="196" rx="104" ry="34" fill="#12c7b8"/>
    <ellipse cx="110" cy="196" rx="62" ry="19" fill="#8fe8dd"/>

    <path d="M 218 271 H 272" stroke="#00add8" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 14" opacity="0.75"/>
  </g>

  <g transform="translate(1540 750)" opacity="0.42">
    <circle cx="0" cy="0" r="60" fill="#f6b73c"/>
  </g>
  <g transform="translate(1370 210)" opacity="0.26">
    <circle cx="0" cy="0" r="50" fill="#12c7b8"/>
  </g>

  <g transform="translate(170 178)">
    <text x="0" y="0" fill="#007d9c" font-family="Nunito, Nunito Variable, Avenir Next, Helvetica Neue, PingFang SC, sans-serif" font-size="34" font-weight="800" letter-spacing="0">DOCKER BUILD</text>
    <text x="0" y="150" fill="#0b2533" font-family="Nunito, Nunito Variable, Avenir Next, Helvetica Neue, PingFang SC, sans-serif" font-size="116" font-weight="900" letter-spacing="0">Modern Dockerfile</text>
    <text x="0" y="286" fill="#12313d" font-family="Nunito, Nunito Variable, Avenir Next, Helvetica Neue, PingFang SC, sans-serif" font-size="68" font-weight="850" letter-spacing="0">现代化 Dockerfile 编写指南</text>
  </g>

  <g transform="translate(170 622)" opacity="0.92">
    <path d="M 0 0 H 420" stroke="url(#cyanInk)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g>
    <text x="170" y="690" fill="#0b2533" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" letter-spacing="0"># syntax=docker/dockerfile:1</text>
    <text x="170" y="740" fill="#5b6f79" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="500" letter-spacing="0">--mount=type=cache · distroless · zstd</text>
