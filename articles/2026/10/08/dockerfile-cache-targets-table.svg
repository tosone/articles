<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="481" viewBox="0 0 1240 481" role="img"
  aria-label="各语言构建缓存挂载目标速查表">
  <foreignObject width="1240" height="481">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1240px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 220px; }
        col:nth-child(2) { width: 490px; }
        col:nth-child(3) { width: 530px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>语言 / 生态</th>
            <th>缓存挂载目标</th>
            <th>构建命令示例</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Go</td>
            <td><code>/go/pkg/mod</code>、<code>/root/.cache/go-build</code></td>
            <td><code>go build -o /app/server ./cmd/server</code></td>
          </tr>
          <tr>
            <td>Node.js</td>
            <td><code>/root/.npm</code> 或 <code>/app/node_modules</code></td>
            <td><code>npm ci --omit=dev</code></td>
          </tr>
          <tr>
            <td>Python</td>
            <td><code>/root/.cache/pip</code></td>
            <td><code>pip install -r requirements.txt</code></td>
          </tr>
          <tr>
            <td>Rust</td>
            <td><code>/usr/local/cargo/registry</code></td>
            <td><code>cargo build --release</code></td>
          </tr>
          <tr>
            <td>Java (Maven)</td>
            <td><code>/root/.m2</code></td>
            <td><code>mvn package</code></td>
          </tr>
          <tr>
            <td>Java (Gradle)</td>
            <td><code>/root/.gradle</code></td>
            <td><code>gradle build</code></td>
          </tr>
          <tr>
            <td>PHP (Composer)</td>
            <td><code>/root/.composer/cache</code></td>
            <td><code>composer install --no-dev</code></td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
