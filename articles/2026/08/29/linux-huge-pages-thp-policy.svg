<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="240" viewBox="0 0 1020 240" role="img"
  aria-label="Transparent huge pages policy table">
  <foreignObject width="1020" height="240">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1020px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 140px; }
        col:nth-child(2) { width: 390px; }
        col:nth-child(3) { width: 490px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>策略</th>
            <th>含义</th>
            <th>适用倾向</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <code>always</code>
            </td>
            <td>内核尽量自动使用 THP</td>
            <td>吞吐优先、延迟不敏感、已验证收益的机器</td>
          </tr>
          <tr>
            <td>
              <code>madvise</code>
            </td>
            <td>只有应用明确标记的区域使用 THP</td>
            <td>更稳妥的生产默认策略</td>
          </tr>
          <tr>
            <td>
              <code>never</code>
            </td>
            <td>普通 THP 路径不主动启用</td>
            <td>强延迟敏感、曾因 THP 抖动的服务</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
