<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img"
  aria-label="Huge pages decision table">
  <foreignObject width="800" height="360">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 800px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 410px; }
        col:nth-child(2) { width: 390px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>业务特征</th>
            <th>建议</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>大块连续内存、长期持有、重复访问</td>
            <td>测试 THP <code>madvise</code> 或 HugeTLB</td>
          </tr>
          <tr>
            <td>专用数据库、DPDK、KVM、HPC</td>
            <td>可以认真规划 HugeTLB</td>
          </tr>
          <tr>
            <td>小对象密集、短请求、延迟敏感</td>
            <td>默认 4KB 页，谨慎使用 THP</td>
          </tr>
          <tr>
            <td>内存紧张、容器混部、资源超卖</td>
            <td>不要预留过多 HugeTLB</td>
          </tr>
          <tr>
            <td>只听说“能减少 TLB miss”</td>
            <td>先测，不要上线改全局</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
