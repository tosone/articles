<svg xmlns="http://www.w3.org/2000/svg" width="2130" height="314" viewBox="0 0 2130 314" role="img"
  aria-label="Linux huge pages mechanism overview table">
  <foreignObject width="2130" height="314">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 2130px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 150px; }
        col:nth-child(2) { width: 340px; }
        col:nth-child(3) { width: 390px; }
        col:nth-child(4) { width: 630px; }
        col:nth-child(5) { width: 620px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>机制</th>
            <th>常见页大小</th>
            <th>使用方式</th>
            <th>适合场景</th>
            <th>主要风险</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>普通页</td>
            <td>4KB</td>
            <td>系统默认</td>
            <td>Web 服务、微服务、短生命周期对象、小块随机分配</td>
            <td>页表数量更多，超大工作集下 TLB 压力更高</td>
          </tr>
          <tr>
            <td>THP</td>
            <td>常见 2MB，也可能有 mTHP</td>
            <td>内核自动合并，或 <code>madvise</code> 提示</td>
            <td>大块匿名内存、缓存、部分 JVM/Go/Rust 进程、虚拟机</td>
            <td>内存压缩、页面合并、单次缺页成本可能带来延迟抖动</td>
          </tr>
          <tr>
            <td>HugeTLB</td>
            <td>2MB / 1GB 等</td>
            <td>预留大页池，应用显式使用</td>
            <td>数据库共享内存、DPDK、KVM、HPC、低延迟专用服务</td>
            <td>需要连续物理内存，不可 swap，预留后普通内存不可用</td>
          </tr>
          <tr>
            <td>1GB 大页</td>
            <td>1GB</td>
            <td>通常启动参数预留</td>
            <td>超大连续内存、虚拟化宿主机、少数数据库/HPC 场景</td>
            <td>粒度太粗，NUMA 和容量规划要求更高</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
