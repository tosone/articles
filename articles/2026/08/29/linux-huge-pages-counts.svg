<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img"
  aria-label="Memory page count comparison table">
  <foreignObject width="560" height="240">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 560px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        th:nth-child(2), th:nth-child(3),
        td:nth-child(2), td:nth-child(3) {
          text-align: right;
        }
        col:nth-child(1) { width: 110px; }
        col:nth-child(2) { width: 260px; }
        col:nth-child(3) { width: 190px; }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>页大小</th>
            <th>覆盖 1GB 需要的页数</th>
            <th>相对 4KB 页</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>4KB</td>
            <td>262144</td>
            <td>1 倍</td>
          </tr>
          <tr>
            <td>2MB</td>
            <td>512</td>
            <td>少 512 倍</td>
          </tr>
          <tr>
            <td>1GB</td>
            <td>1</td>
            <td>少 262144 倍</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
