<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="360" viewBox="0 0 1160 360" role="img"
  aria-label="Huge pages validation metrics table">
  <foreignObject width="1160" height="360">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1160px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 210px; }
        col:nth-child(2) { width: 950px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>维度</th>
            <th>观察指标</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>CPU 地址翻译</td>
            <td><code>dTLB-load-misses</code>、<code>iTLB-load-misses</code>、page walk 相关事件</td>
          </tr>
          <tr>
            <td>内存行为</td>
            <td>RSS、page cache、major/minor fault、swap、NUMA remote access</td>
          </tr>
          <tr>
            <td>内核行为</td>
            <td>compaction、khugepaged、direct reclaim、kswapd</td>
          </tr>
          <tr>
            <td>业务效果</td>
            <td>QPS、平均延迟、P95、P99、P999、错误率</td>
          </tr>
          <tr>
            <td>稳定性</td>
            <td>OOM、分配失败、容器重启、节点不可调度</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
