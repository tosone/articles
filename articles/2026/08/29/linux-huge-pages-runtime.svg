<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="482" viewBox="0 0 1060 482" role="img"
  aria-label="Huge pages runtime guidance table">
  <foreignObject width="1060" height="482">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1060px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 260px; }
        col:nth-child(2) { width: 800px; }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>运行时/系统</th>
            <th>建议</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>PostgreSQL/MySQL</td>
            <td>优先看官方 huge page 配置，配合 shared buffer/buffer pool 大小规划。</td>
          </tr>
          <tr>
            <td>Redis</td>
            <td>通常谨慎对待 THP，重点观察 fork、持久化和延迟。</td>
          </tr>
          <tr>
            <td>JVM</td>
            <td>不要只看堆大小，结合 GC、region size、启动参数和容器限制测试。</td>
          </tr>
          <tr>
            <td>Go 服务</td>
            <td>默认先保守，除非 pprof/perf 证明 TLB 或 page walk 是瓶颈。</td>
          </tr>
          <tr>
            <td>DPDK</td>
            <td>HugeTLB 通常是基础要求，需要按 NUMA 和网卡拓扑规划。</td>
          </tr>
          <tr>
            <td>KVM</td>
            <td>大页可能有明显收益，但要和 vCPU 绑核、内存绑定、迁移策略一起看。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
