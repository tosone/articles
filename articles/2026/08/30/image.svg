<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000"
  role="img" aria-label="Linux kernel Clang and GNU C extensions article cover">
  <defs>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito Variable";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="0.58" stop-color="#edfaff" />
      <stop offset="1" stop-color="#f5f2e9" />
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00add8" />
      <stop offset="1" stop-color="#12c7b8" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2533" />
      <stop offset="1" stop-color="#164557" />
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#8ac9d8" stroke-width="1" opacity="0.18" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.2" markerHeight="5.2"
      orient="auto" markerUnits="strokeWidth">
      <path d="M 2 2 L 8.8 5 L 2 8" fill="none" stroke="#8a9aa3" stroke-width="1.3"
        stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="2350" height="1000" fill="url(#paper)" />
  <rect width="2350" height="1000" fill="url(#grid)" />

  <g transform="translate(170 160)">
    <rect x="0" y="0" width="292" height="58" rx="0" fill="#f6b73c" />
    <text x="146" y="39" text-anchor="middle" fill="#0b2533"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="28"
      font-weight="900" letter-spacing="0">LINUX KERNEL</text>

    <text x="0" y="190" fill="#0b2533"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="116"
      font-weight="900" letter-spacing="0">GNU C Extensions</text>
    <text x="0" y="306" fill="#12313d"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="68"
      font-weight="850" letter-spacing="0">Clang 编译内核难在哪</text>
    <text x="2" y="386" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="34"
      font-weight="600" letter-spacing="0">asm goto / typeof / section / builtins / LTO semantics</text>
  </g>

  <g transform="translate(170 716)">
    <rect x="0" y="0" width="1004" height="126" rx="26" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2" />
    <text x="42" y="52" fill="#007d9c"
      font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="30"
      font-weight="800" letter-spacing="0">asm goto("jz %l[slow]" : "=r"(out) : ...)</text>
    <text x="42" y="92" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="25"
      font-weight="650" letter-spacing="0">compiler extensions meet kernel control flow and ELF
      layout</text>
  </g>

  <g transform="translate(1286 203)">
    <g>
      <rect x="92" y="20" width="586" height="180" rx="28" fill="#ffffff" stroke="#b7e8f2"
        stroke-width="2" />
      <rect x="92" y="306" width="586" height="92" rx="26" fill="url(#cyan)" />
      <rect x="92" y="504" width="586" height="118" rx="26" fill="#ffffff" stroke="#b7e8f2"
        stroke-width="2" />
    </g>

    <text x="385" y="70" text-anchor="middle" fill="#0b2533"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="34"
      font-weight="500" letter-spacing="0">GCC</text>
    <text x="385" y="106" text-anchor="middle" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="22"
      font-weight="400" letter-spacing="0">GNU C dialect in practice</text>

    <g transform="translate(112 134)">
      <rect x="0" y="0" width="150" height="50" rx="17" fill="#e6f9fd" stroke="#9bdce8"
        stroke-width="2" />
      <text x="75" y="33" text-anchor="middle" fill="#007d9c"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18"
        font-weight="500" letter-spacing="0">asm goto</text>

      <rect x="198" y="0" width="150" height="50" rx="17" fill="#e6f9fd" stroke="#9bdce8"
        stroke-width="2" />
      <text x="273" y="33" text-anchor="middle" fill="#007d9c"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18"
        font-weight="500" letter-spacing="0">typeof</text>

      <rect x="396" y="0" width="150" height="50" rx="17" fill="#fff8e6" stroke="#f6b73c"
        stroke-width="2" />
      <text x="471" y="33" text-anchor="middle" fill="#9a6700"
        font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="18"
        font-weight="500" letter-spacing="0">section</text>
    </g>

    <text x="385" y="362" text-anchor="middle" fill="#ffffff"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="31"
      font-weight="500" letter-spacing="0">GNU C extension contract</text>

    <text x="385" y="552" text-anchor="middle" fill="#0b2533"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="33"
      font-weight="500" letter-spacing="0">Clang / LLVM</text>
    <text x="385" y="586" text-anchor="middle" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="22"
      font-weight="400" letter-spacing="0">compatible implementation</text>

    <g fill="none" stroke="#8a9aa3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      marker-end="url(#arrow)">
      <path d="M 385 216 V 290" />
      <path d="M 385 414 V 488" />
    </g>

  </g>
</svg>
