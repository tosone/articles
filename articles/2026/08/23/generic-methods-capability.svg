<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="498" viewBox="0 0 2320 498" role="img"
  aria-label="Go generic methods capability table">
  <foreignObject x="0" y="0" width="2320" height="498">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 2320px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          overflow: hidden;
          border-radius: 0;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 300px; }
        col:nth-child(2) { width: 1290px; }
        col:nth-child(3) { width: 730px; }
        th, td {
          padding: 22px 28px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.45;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
        }
        th {
          height: 82px;
          background: #00add8;
          color: #ffffff;
          font-size: 28px;
          font-weight: 850;
        }
        td {
          font-size: 24px;
          font-weight: 650;
        }
        td:first-child {
          color: #0b2533;
          font-size: 25px;
          font-weight: 850;
        }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.94em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>能力</th>
            <th>Go 1.18 到 Go 1.26</th>
            <th>Go 1.27</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>泛型类型</td>
            <td>支持，例如 <code>type Set[T comparable] map[T]struct{}</code></td>
            <td>继续支持</td>
          </tr>
          <tr>
            <td>泛型函数</td>
            <td>支持，例如 <code>func Map[T, U any](...) ...</code></td>
            <td>继续支持</td>
          </tr>
          <tr>
            <td>泛型方法</td>
            <td>方法只能使用接收者类型已有的类型参数</td>
            <td>方法可以声明自己的类型参数</td>
          </tr>
          <tr>
            <td>接口方法类型参数</td>
            <td>不支持</td>
            <td>仍然不建议理解为完整 trait 系统</td>
          </tr>
          <tr>
            <td>高阶类型参数</td>
            <td>不支持</td>
            <td>仍不支持</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
