<svg xmlns="http://www.w3.org/2000/svg" width="3170" height="412" viewBox="0 0 3170 412" role="img"
  aria-label="Generic methods comparison table">
  <foreignObject x="0" y="0" width="3170" height="412">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 3170px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          overflow: hidden;
          border-radius: 0;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 270px; }
        col:nth-child(2) { width: 900px; }
        col:nth-child(3) { width: 690px; }
        col:nth-child(4) { width: 620px; }
        col:nth-child(5) { width: 690px; }
        th, td {
          padding: 22px 28px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.45;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
        }
        th {
          height: 82px;
          background: #00add8;
          color: #ffffff;
          font-size: 28px;
          font-weight: 850;
        }
        td {
          font-size: 24px;
          font-weight: 650;
        }
        td:first-child {
          color: #0b2533;
          font-size: 25px;
          font-weight: 850;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.94em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>语言</th>
            <th>泛型方法形态</th>
            <th>类型信息</th>
            <th>主要优势</th>
            <th>主要代价</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Go 1.27</td>
            <td>
              <code>func (s Stream[T]) Map[U any](...) Stream[U]</code>
            </td>
            <td>编译期检查，保留 Go 的接口和包级编译模型</td>
            <td>API 组织更自然，复杂度受控</td>
            <td>表达力仍有限，不能当作 trait / HKT 使用</td>
          </tr>
          <tr>
            <td>C++</td>
            <td>
              <code>template &lt;typename U&gt; Stream&lt;U&gt; map(...)</code>
            </td>
            <td>编译期模板实例化</td>
            <td>表达力极强，零成本抽象空间大</td>
            <td>编译成本、错误信息和复杂度高</td>
          </tr>
          <tr>
            <td>TypeScript</td>
            <td>
              <code>map&lt;U&gt;(fn: (item: T) =&gt; U): Stream&lt;U&gt;</code>
            </td>
            <td>编译期类型，运行时擦除</td>
            <td>推断强，类型变换能力丰富，写法自然</td>
            <td>运行时没有泛型保证，类型可能和真实数据脱节</td>
          </tr>
          <tr>
            <td>Rust</td>
            <td>
              <code>fn map&lt;U, F&gt;(self, f: F) -&gt; Stream&lt;U&gt;</code>
            </td>
            <td>编译期单态化，trait bound 明确</td>
            <td>类型安全强，零成本抽象和 trait 组合成熟</td>
            <td>trait object / object safety 边界更复杂</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
