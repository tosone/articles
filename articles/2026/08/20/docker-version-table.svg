<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="430" viewBox="0 0 2110 430" role="img"
  aria-label="Docker version boundary table">
  <foreignObject x="0" y="0" width="2110" height="430">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 2110px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          overflow: hidden;
          border-radius: 0;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 620px; }
        col:nth-child(2) { width: 970px; }
        col:nth-child(3) { width: 520px; }
        th, td {
          padding: 22px 28px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.45;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
        }
        th {
          height: 82px;
          background: #00add8;
          color: #ffffff;
          font-size: 28px;
          font-weight: 850;
        }
        td {
          font-size: 24px;
          font-weight: 650;
        }
        td:first-child {
          color: #0b2533;
          font-size: 25px;
          font-weight: 850;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.94em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>你看到的版本</th>
            <th>它是什么</th>
            <th>应该怎么用</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <code>docker-v29.x.x</code>
            </td>
            <td>Docker Engine 的软件发布 tag。从 v29 起加 <code>docker-</code> 前缀，避免 Go 工具链把 <code>v29.0.0</code>
              当成 Go module 的第 29 个大版本。</td>
            <td>给 Engine 用户、发行版维护者和构建流程使用。</td>
          </tr>
          <tr>
            <td><code>github.com/moby/moby/v2</code> @ <code>v2.0.0-beta.N</code></td>
            <td>Moby 仓库根模块，用来构建容器引擎二进制。官方明确说它是内部实现细节，不保证 API 稳定。</td>
            <td>不要在业务代码里 <code>go get</code>。除非你在构建自定义 Engine。</td>
          </tr>
          <tr>
            <td><code>github.com/moby/moby/client</code>、<code>github.com/moby/moby/api</code> @ <code>
              v1.x.x</code></td>
            <td>Docker Engine API 的公共 Go SDK，独立打 tag、独立演进。</td>
            <td>Go 项目迁移时应该使用的模块。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
