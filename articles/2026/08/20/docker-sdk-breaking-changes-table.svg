<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1212" viewBox="0 0 2500 1212"
  role="img" aria-label="Docker Go SDK breaking changes table">
  <foreignObject x="0" y="0" width="2500" height="1212">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 2500px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          overflow: hidden;
          border-radius: 0;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 420px; }
        col:nth-child(2) { width: 1160px; }
        col:nth-child(3) { width: 920px; }
        th, td {
          padding: 22px 28px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.45;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
        }
        th {
          height: 82px;
          background: #00add8;
          color: #ffffff;
          font-size: 28px;
          font-weight: 850;
        }
        td {
          font-size: 24px;
          font-weight: 650;
        }
        td:first-child {
          color: #0b2533;
          font-size: 25px;
          font-weight: 850;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.94em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>变化方向</th>
            <th>典型例子</th>
            <th>迁移含义</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>option 类型迁到 <code>client</code> 包</td>
            <td><code>api/types/image</code>、<code>api/types/container</code>、<code>
              api/types/network</code>、<code>api/types/swarm</code>、<code>api/types/volume</code>
              中大量 <code>ListOptions</code>、<code>InspectOptions</code>、<code>CreateOptions</code>、<code>
              PruneOptions</code> 被移动。</td>
            <td>调用 client 方法时，优先从 <code>github.com/moby/moby/client</code> 找 options/result 类型，不要继续从 <code>
              api/types/...</code> 里找。</td>
          </tr>
          <tr>
            <td>方法参数改为 option struct</td>
            <td><code>ImageBuild</code>、<code>ImageList</code>、<code>ImageRemove</code>、<code>
              ImageTag</code>、<code>ImageSearch</code>、<code>ConfigCreate</code>、<code>ConfigList</code>
              、各类 <code>Prune</code> 方法。</td>
            <td>过去的多个位置参数要改成一个 options struct；默认值、空值语义要重新检查。</td>
          </tr>
          <tr>
            <td>返回值改为 result struct</td>
            <td><code>ImageInspect</code>、<code>ImageHistory</code>、<code>ImageLoad</code>、<code>
              ImageSave</code>、<code>ConfigInspectWithRaw</code> 等。</td>
            <td>过去直接接收多个返回值的代码，需要从 result struct 中取字段。</td>
          </tr>
          <tr>
            <td>方法重命名</td>
            <td><code>ContainerExec...</code> 系列改为 <code>Exec...</code>。</td>
            <td>接口抽象、mock、封装层都要同步改名。</td>
          </tr>
          <tr>
            <td>镜像拉推流式输出变化</td>
            <td><code>ImagePull</code> / <code>ImagePush</code> 返回带 <code>JSONMessages</code>
              方法的对象，提供消息迭代器。</td>
            <td>旧的 <code>io.Reader</code> / <code>jsonmessage</code> 处理逻辑需要重写。</td>
          </tr>
          <tr>
            <td>filters 换类型</td>
            <td>客户端使用新的 <code>client.Filters</code>，旧 <code>api/types/filters</code> 需要迁移。</td>
            <td>构造过滤条件的 helper、测试断言、序列化逻辑都要改。</td>
          </tr>
          <tr>
            <td>网络/IP 类型现代化</td>
            <td>IP 地址和子网改为 <code>netip.Addr</code> / <code>netip.Prefix</code>；MAC 地址字段使用兼容 <code>
              net.HardwareAddr</code> 的 byte slice。</td>
            <td>旧代码里把 IP/MAC 当字符串拼接、比较、JSON 断言的地方要重写。</td>
          </tr>
          <tr>
            <td>类型重命名和搬家</td>
            <td><code>container.Port</code> 改为 <code>PortSummary</code>；<code>ErrorResponse</code>
              移到 <code>common.ErrorResponse</code>；<code>api/types/versions</code> 移到 client/daemon；<code>
              StatsResponseReader</code> 移到 <code>client</code>。</td>
            <td>编译错误会集中爆发，建议按模块边界逐批迁移。</td>
          </tr>
          <tr>
            <td>deprecated 字段删除</td>
            <td><code>image.InspectResponse.VirtualSize</code>、<code>ContainerConfig</code>、<code>
              Parent</code>、<code>DockerVersion</code>；<code>AuthConfig.Email</code>；<code>
              ServiceSpec.Networks</code> 等。</td>
            <td>依赖老字段的展示、缓存、兼容层需要替代实现。</td>
          </tr>
          <tr>
            <td>API 版本协商能力减少</td>
            <td>移除对 API <code>&lt; 1.44</code> 的协商支持。</td>
            <td>想同时兼容很老 daemon 的客户端库，需要保留旧 SDK 分支或做版本矩阵。</td>
          </tr>
          <tr>
            <td>内部包清理</td>
            <td><code>pkg/archive</code>、<code>pkg/chrootarchive</code>、<code>pkg/atomicwriter</code>
              、<code>pkg/reexec</code>、<code>pkg/platform</code>、<code>pkg/parsers</code>、<code>
              pkg/system.MkdirAll</code> 等移除。</td>
            <td>以前“顺手 import Docker 内部工具包”的项目，要改用 <code>github.com/moby/go-archive</code>、<code>
              github.com/moby/sys</code> 或标准库。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
