<svg xmlns="http://www.w3.org/2000/svg" width="2225" height="772" viewBox="0 0 2225 772" role="img"
  aria-label="Docker v29 compatibility table">
  <foreignObject x="0" y="0" width="2225" height="772">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 2225px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          overflow: hidden;
          border-radius: 0;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 180px; }
        col:nth-child(2) { width: 675px; }
        col:nth-child(3) { width: 610px; }
        col:nth-child(4) { width: 760px; }
        th, td {
          padding: 22px 28px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.45;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
        }
        th {
          height: 82px;
          background: #00add8;
          color: #ffffff;
          font-size: 28px;
          font-weight: 850;
        }
        td {
          font-size: 24px;
          font-weight: 650;
        }
        td:first-child {
          color: #0b2533;
          font-size: 25px;
          font-weight: 850;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.94em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>类别</th>
            <th>变化</th>
            <th>典型影响</th>
            <th>处理建议</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>API 版本</td>
            <td>daemon 最低 API 提到 <code>1.44</code>，客户端不再兼容 API <code>&lt; 1.44</code>。</td>
            <td>老 Docker CLI、老 SDK、老运维工具无法连接 daemon。</td>
            <td>升级调用方；临时用 <code>DOCKER_MIN_API_VERSION</code> 或 <code>min-api-version</code> 放行。</td>
          </tr>
          <tr>
            <td>镜像存储</td>
            <td>新安装默认 containerd image store，legacy graph driver deprecated。</td>
            <td>基于旧 graph driver 行为的清理、审计、容量统计脚本失效。</td>
            <td>在测试机确认 <code>docker info</code>、<code>docker system df</code>、镜像 inspect 和备份流程。</td>
          </tr>
          <tr>
            <td>API 输出</td>
            <td>Engine API 升到 <code>1.52</code>，部分字段省略、改名或移除。</td>
            <td>解析 JSON 的自动化程序可能拿不到旧字段。</td>
            <td>不要依赖空字段存在；对 <code>GraphDriver</code>、<code>VirtualSize</code>、镜像 inspect 字段做兼容。</td>
          </tr>
          <tr>
            <td>CLI JSON</td>
            <td><code>docker version --format '{{json .}}'</code> 在 v29.0.x 出现过字段大小写/时间格式变化。</td>
            <td>Ansible <code>community.docker</code>、CI 版本探测脚本可能报 <code>ApiVersion</code> 缺失。</td>
            <td>优先调用 Engine <code>/version</code> API；或同时兼容 <code>ApiVersion</code> / <code>
              APIVersion</code>。</td>
          </tr>
          <tr>
            <td>网络防火墙</td>
            <td>nftables 可实验启用，但不会自动打开 IP forwarding。</td>
            <td>bridge 网络、端口发布、宿主机转发策略可能和 iptables 后端不同。</td>
            <td>先灰度；显式配置 <code>net.ipv4.ip_forward</code>、<code>net.ipv6.conf.all.forwarding</code>
              和宿主机防火墙边界。</td>
          </tr>
          <tr>
            <td>平台支持</td>
            <td>cgroup v1、ARMv6/Raspbian 32 位、DCT 等能力退场。</td>
            <td>老系统、老设备、老信任链路需要迁移。</td>
            <td>把 OS、内核、发行版包源、签名方案一起纳入升级计划。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
