<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="420" viewBox="0 0 1540 420" role="img"
  aria-label="Bun 1.4 runtime changes table">
  <foreignObject width="1540" height="420">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1540px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 131px; }
        col:nth-child(2) { width: 449px; }
        col:nth-child(3) { width: 556px; }
        col:nth-child(4) { width: 404px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr><th>方向</th><th>Zig 版本的边界</th><th>Bun 1.4.0 的变化</th><th>开发者意义</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>内存安全</td>
            <td>GC 与手动内存管理交错，生命周期难审</td>
            <td>用 Rust ownership / Drop 收紧释放边界</td>
            <td>减少泄漏、UAF、double-free 风险</td>
          </tr>
          <tr>
            <td>资源占用</td>
            <td>空闲 CPU 和 HTTP 内存曲线仍有压力</td>
            <td>统一 allocator，优化 GC timer 和 futex</td>
            <td>常驻服务和 SSR 更值得复测</td>
          </tr>
          <tr>
            <td>启动速度</td>
            <td>Linux hello.js 约 10.9 ms</td>
            <td>Linux hello.js 约 5.1 ms</td>
            <td>CLI、serverless、脚本体感更明显</td>
          </tr>
          <tr>
            <td>兼容性</td>
            <td>生态工具仍会踩 Node 内置模块细节</td>
            <td>新增 1517 个 Node 测试通过项</td>
            <td>迁移风险下降，但仍需实测</td>
          </tr>
          <tr>
            <td>诊断</td>
            <td>生产 profile 和异步栈能力不足</td>
            <td>CPU/heap profile、Markdown 报告、inspector</td>
            <td>线上问题更容易定位</td>
          </tr>
          <tr>
            <td>工具链</td>
            <td>部分常用能力仍靠 npm 包补齐</td>
            <td>Image/WebView/Markdown/Cron/Terminal 内置</td>
            <td>脚本和内部工具依赖更少</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
