<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="584" viewBox="0 0 1880 584" role="img"
  aria-label="Bun and Node.js runtime choice table">
  <foreignObject x="0" y="0" width="1880" height="584">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1880px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          overflow: hidden;
          border-radius: 0;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 360px; }
        col:nth-child(2) { width: 700px; }
        col:nth-child(3) { width: 820px; }
        th, td {
          padding: 22px 28px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.45;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
        }
        th {
          height: 82px;
          background: #00add8;
          color: #ffffff;
          font-size: 28px;
          font-weight: 850;
        }
        td {
          font-size: 24px;
          font-weight: 650;
        }
        td:first-child {
          color: #0b2533;
          font-size: 25px;
          font-weight: 850;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>项目类型</th>
            <th>更适合 Bun</th>
            <th>更适合 Node.js</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>新 TypeScript 服务</td>
            <td>想要低配置、快速启动、少工具链，且依赖较新。</td>
            <td>公司运行基线必须统一 Node LTS。</td>
          </tr>
          <tr>
            <td>旧 Express/Fastify 服务</td>
            <td>依赖简单，测试完整，性能或内存有明确痛点。</td>
            <td>依赖老插件、native addon、APM agent 或复杂 monkey patch。</td>
          </tr>
          <tr>
            <td>CLI / 内部工具</td>
            <td>启动速度、单二进制体验、直接跑 TS 很重要。</td>
            <td>分发环境只保证 Node，或依赖 Node 专属调试工具。</td>
          </tr>
          <tr>
            <td>Serverless / Edge</td>
            <td>冷启动敏感，依赖轻，能接受 runtime 灰度。</td>
            <td>平台只支持 Node LTS，或合规要求保守。</td>
          </tr>
          <tr>
            <td>大型前端 monorepo</td>
            <td>install/test/build 时间是主要瓶颈。</td>
            <td>现有 pnpm/Vite/Vitest 缓存和插件链已经稳定。</td>
          </tr>
          <tr>
            <td>企业核心系统</td>
            <td>适合作为灰度或新模块试点。</td>
            <td>默认仍应选择 Node LTS，除非收益被实测证明。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
