<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="320" viewBox="0 0 1580 320" role="img"
  aria-label="Zig toolchain responsibility table">
  <foreignObject x="0" y="0" width="1580" height="320">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1580px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 340px; }
        col:nth-child(2) { width: 610px; }
        col:nth-child(3) { width: 630px; }
        th, td {
          padding: 16px 22px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.42;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
          font-weight: 400;
        }
        th {
          height: 68px;
          background: #00add8;
          color: #ffffff;
          font-size: 25px;
        }
        td {
          height: 84px;
          font-size: 23px;
        }
        td:first-child {
          color: #0b2533;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>概念</th>
            <th>负责什么</th>
            <th>Zig 能否直接提供</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>编译器与 linker driver</td>
            <td>编译 C/C++，组织链接参数，调用链接器。</td>
            <td>能，使用 <code>zig cc</code> / <code>zig c++</code>。</td>
          </tr>
          <tr>
            <td>libc 与基础 sysroot</td>
            <td>libc 头文件、ABI 信息、启动对象。</td>
            <td>对 Zig 支持的常见目标可以提供或生成。</td>
          </tr>
          <tr>
            <td>第三方原生依赖</td>
            <td>OpenSSL、SQLite、CUDA、厂商 SDK 等。</td>
            <td>通常不能，需要源码交叉编译或准备目标库。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
