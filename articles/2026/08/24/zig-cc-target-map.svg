<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="488" viewBox="0 0 1840 488" role="img"
  aria-label="Zig Rust Go target mapping table">
  <foreignObject x="0" y="0" width="1840" height="488">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1840px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 380px; }
        col:nth-child(2) { width: 360px; }
        col:nth-child(3) { width: 510px; }
        col:nth-child(4) { width: 590px; }
        th, td {
          padding: 14px 20px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.35;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
          font-weight: 400;
        }
        th {
          height: 62px;
          background: #00add8;
          color: #ffffff;
          font-size: 24px;
        }
        td {
          height: 71px;
          font-size: 22px;
        }
        td:first-child {
          color: #0b2533;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.9em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>目标</th>
            <th>Zig</th>
            <th>Rust</th>
            <th>Go</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Linux x86-64 + glibc</td>
            <td><code>x86_64-linux-gnu</code></td>
            <td><code>x86_64-unknown-linux-gnu</code></td>
            <td><code>GOOS=linux GOARCH=amd64</code></td>
          </tr>
          <tr>
            <td>Linux ARM64 + glibc</td>
            <td><code>aarch64-linux-gnu</code></td>
            <td><code>aarch64-unknown-linux-gnu</code></td>
            <td><code>GOOS=linux GOARCH=arm64</code></td>
          </tr>
          <tr>
            <td>Linux x86-64 + musl</td>
            <td><code>x86_64-linux-musl</code></td>
            <td><code>x86_64-unknown-linux-musl</code></td>
            <td><code>GOOS=linux GOARCH=amd64</code></td>
          </tr>
          <tr>
            <td>Linux ARM64 + musl</td>
            <td><code>aarch64-linux-musl</code></td>
            <td><code>aarch64-unknown-linux-musl</code></td>
            <td><code>GOOS=linux GOARCH=arm64</code></td>
          </tr>
          <tr>
            <td>Windows x86-64 GNU ABI</td>
            <td><code>x86_64-windows-gnu</code></td>
            <td><code>x86_64-pc-windows-gnu</code></td>
            <td><code>GOOS=windows GOARCH=amd64</code></td>
          </tr>
          <tr>
            <td>macOS ARM64</td>
            <td><code>aarch64-macos</code></td>
            <td><code>aarch64-apple-darwin</code></td>
            <td><code>GOOS=darwin GOARCH=arm64</code></td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
