<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="520" viewBox="0 0 2360 520" role="img"
  aria-label="Zig cross compilation summary table">
  <foreignObject x="0" y="0" width="2360" height="520">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 2360px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 260px; }
        col:nth-child(2) { width: 560px; }
        col:nth-child(3) { width: 560px; }
        col:nth-child(4) { width: 980px; }
        th, td {
          padding: 16px 22px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.42;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
          font-weight: 400;
        }
        th {
          height: 68px;
          background: #00add8;
          color: #ffffff;
          font-size: 25px;
        }
        td {
          height: 75px;
          font-size: 23px;
        }
        td:first-child {
          color: #0b2533;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>场景</th>
            <th>不使用 Zig</th>
            <th>使用 Zig</th>
            <th>仍然需要自己准备什么</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>纯 Rust</td>
            <td><code>rustup</code> 目标标准库，部分目标还要外部 linker。</td>
            <td><code>cargo zigbuild --target ...</code>。</td>
            <td>Rust 目标标准库。</td>
          </tr>
          <tr>
            <td>Rust + C/C++ crate</td>
            <td>目标 GCC/Clang、sysroot、C/C++ 运行库。</td>
            <td><code>cargo-zigbuild</code> 注入 Zig linker 和编译器包装。</td>
            <td>第三方库、非系统头文件，部分场景还要 <code>bindgen</code> 的宿主机 <code>libclang</code>。</td>
          </tr>
          <tr>
            <td>纯 Go</td>
            <td><code>GOOS</code>、<code>GOARCH</code> 通常已经够用。</td>
            <td>通常没必要使用 Zig。</td>
            <td>无。</td>
          </tr>
          <tr>
            <td>Go + cgo</td>
            <td>目标 C/C++ 编译器、libc、外部 linker。</td>
            <td><code>CC="zig cc -target ..."</code>，必要时再设置 <code>CXX</code>。</td>
            <td>第三方目标库、头文件、正确的 <code>pkg-config</code> 配置。</td>
          </tr>
          <tr>
            <td>Linux glibc 兼容</td>
            <td>在老发行版或对应 sysroot 中构建。</td>
            <td>目标名可声明 glibc 版本下限。</td>
            <td>在真实旧系统上验证。</td>
          </tr>
          <tr>
            <td>Linux 静态发布</td>
            <td>单独安装 musl 工具链。</td>
            <td>选择 <code>*-linux-musl</code> 并走外部静态链接。</td>
            <td>确认所有原生依赖都能静态链接。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
