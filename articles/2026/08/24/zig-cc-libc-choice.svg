<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="220" viewBox="0 0 1820 220" role="img"
  aria-label="glibc and musl choice table">
  <foreignObject x="0" y="0" width="1820" height="220">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1820px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          background: #ffffff;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          color: #173642;
          letter-spacing: 0;
        }
        col:nth-child(1) { width: 320px; }
        col:nth-child(2) { width: 760px; }
        col:nth-child(3) { width: 740px; }
        th, td {
          padding: 15px 22px;
          border-right: 2px solid #d5eef4;
          border-bottom: 2px solid #d5eef4;
          text-align: left;
          vertical-align: middle;
          line-height: 1.35;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
          white-space: normal;
          font-weight: 400;
        }
        th {
          height: 62px;
          background: #00add8;
          color: #ffffff;
          font-size: 24px;
        }
        td {
          height: 79px;
          font-size: 22px;
        }
        td:first-child {
          color: #0b2533;
        }
        th:last-child, td:last-child { border-right: 0; }
        tr:last-child td { border-bottom: 0; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.9em;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>选择</th>
            <th>优点</th>
            <th>代价</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>*-linux-gnu.2.17</code></td>
            <td>对传统 Linux 软件生态兼容更好，动态库更常见。</td>
            <td>运行时依赖目标机 glibc，不能把“指定版本”当成完全静态。</td>
          </tr>
          <tr>
            <td><code>*-linux-musl</code></td>
            <td>容易生成自包含静态二进制，适合 <code>scratch</code> 或极简容器。</td>
            <td>DNS、locale、动态加载、部分 C 库兼容行为与 glibc 不同。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
