<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000"
  role="img"
  aria-label="npm supply chain attack targeting Alibaba developer ecosystem article cover">
  <defs>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito Variable";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="0.58" stop-color="#edfaff" />
      <stop offset="1" stop-color="#f5f2e9" />
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#8ac9d8" stroke-width="1" opacity="0.16" />
    </pattern>
  </defs>

  <rect width="2350" height="1000" fill="url(#paper)" />
  <rect width="2350" height="1000" fill="url(#grid)" />

  <!-- 左侧文案区 -->
  <g transform="translate(170 158)">
    <rect x="0" y="0" width="288" height="58" rx="0" fill="#0b2533" />
    <text x="144" y="39" text-anchor="middle" fill="#ffffff"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="28"
      letter-spacing="0">SUPPLY CHAIN</text>

    <text x="0" y="188" fill="#0b2533" font-weight="900"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="112"
      letter-spacing="0">npm 投毒</text>
    <text x="0" y="304" fill="#12313d" font-weight="800"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="70"
      letter-spacing="0">阿里开发者生态被定向攻击</text>
    <text x="2" y="384" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="34"
      letter-spacing="0">private package impersonation · staged loader · cross-platform RAT</text>
  </g>

  <!-- 左下角攻击链卡片 -->
  <g transform="translate(170 704)">
    <rect x="0" y="0" width="1038" height="128" rx="26" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2" />
    <text x="42" y="53" fill="#007d9c"
      font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="30"
      letter-spacing="0">install -&gt; config -&gt; vm escape -&gt; aone-cli RAT</text>
    <text x="42" y="92" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="25"
      letter-spacing="0">developer workstation is part of the production security boundary</text>
  </g>

  <!-- 右侧：被投毒的包（裂痕）+ 告警标 + 终端 + C2 节点 + 盾牌 -->
  <g>
    <!-- 包体与裂痕 -->
    <rect x="1460" y="260" width="280" height="280" rx="28" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2.5" />
    <line x1="1460" y1="344" x2="1740" y2="344" stroke="#b7e8f2" stroke-width="2.5" />
    <line x1="1600" y1="260" x2="1600" y2="344" stroke="#b7e8f2" stroke-width="2.5" />
    <rect x="1560" y="404" width="80" height="80" rx="18" fill="#eaf7fb" stroke="#8ac9d8"
      stroke-width="2.5" />
    <path d="M1474 296l38 32-24 28 44 34-28 32 42 38-32 34 30 32" fill="none" stroke="#f6b73c"
      stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 告警标 -->
    <rect x="1697" y="237" width="96" height="96" rx="24" fill="#ffffff" stroke="#f6b73c"
      stroke-width="2.5" />
    <path d="M1745 262l28 48h-56z" fill="none" stroke="#f6b73c" stroke-width="4"
      stroke-linejoin="round" />
    <line x1="1745" y1="282" x2="1745" y2="294" stroke="#f6b73c" stroke-width="4"
      stroke-linecap="round" />
    <circle cx="1745" cy="302" r="2.8" fill="#f6b73c" />

    <!-- 终端（RAT 落点） -->
    <rect x="1460" y="635" width="280" height="170" rx="20" fill="#0b2533" />
    <circle cx="1494" cy="667" r="7" fill="#00add8" />
    <circle cx="1518" cy="667" r="7" fill="#12c7b8" />
    <circle cx="1542" cy="667" r="7" fill="#f6b73c" />
    <rect x="1494" y="700" width="150" height="12" rx="6" fill="#3f5b69" />
    <rect x="1494" y="726" width="200" height="12" rx="6" fill="#3f5b69" />
    <rect x="1494" y="752" width="120" height="12" rx="6" fill="#3f5b69" />
    <rect x="1626" y="752" width="10" height="12" rx="3" fill="#f6b73c" />

    <!-- C2 节点与信号 -->
    <circle cx="1980" cy="330" r="76" fill="none" stroke="#f6b73c" stroke-width="2" opacity="0.25" />
    <circle cx="1980" cy="330" r="56" fill="none" stroke="#f6b73c" stroke-width="2" opacity="0.5" />
    <circle cx="1980" cy="330" r="34" fill="#f6b73c" />
    <circle cx="1980" cy="330" r="12" fill="#ffffff" opacity="0.85" />
    <line x1="1912" y1="386" x2="1866" y2="450" stroke="#b7e8f2" stroke-width="2.5" />
    <circle cx="1856" cy="468" r="22" fill="#ffffff" stroke="#b7e8f2" stroke-width="2.5" />
    <line x1="2048" y1="386" x2="2094" y2="450" stroke="#b7e8f2" stroke-width="2.5" />
    <circle cx="2104" cy="468" r="22" fill="#ffffff" stroke="#b7e8f2" stroke-width="2.5" />

    <!-- 盾牌（凭证边界） -->
    <path d="M2010 620l65 24v60c0 56-34 94-65 114-31-20-65-58-65-114v-60z" fill="#ffffff"
      stroke="#00add8" stroke-width="3" stroke-linejoin="round" />
    <circle cx="2010" cy="700" r="14" fill="none" stroke="#00add8" stroke-width="3" />
    <rect x="2004" y="710" width="12" height="28" rx="6" fill="#00add8" />
  </g>
</svg>
