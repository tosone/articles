<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="343" viewBox="0 0 1610 343" role="img"
  aria-label="attack platform behavior table">
  <foreignObject width="1610" height="343">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1610px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 150px; }
        col:nth-child(2) { width: 780px; }
        col:nth-child(3) { width: 680px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>平台</th>
            <th>公开报道中的行为</th>
            <th>防守关注点</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Windows</td>
            <td>尝试终止或替换 Alilang 相关企业安全、VPN、办公应用核心文件，例如 <code>app.asar</code>。</td>
            <td>检查企业工具安装目录、asar 文件哈希、异常进程终止记录。</td>
          </tr>
          <tr>
            <td>Linux</td>
            <td>下载二进制到 <code>/tmp</code>，后台运行后删除磁盘文件。</td>
            <td>检查 <code>/tmp</code> 执行痕迹、进程树、bash/zsh 历史、EDR 进程事件。</td>
          </tr>
          <tr>
            <td>macOS</td>
            <td>修改 <code>~/.zshrc</code> 并创建 10 分钟周期的 Launch Agent。</td>
            <td>检查 shell 启动文件、<code>~/Library/LaunchAgents</code>、定时任务和登录项。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
