<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000"
  role="img" aria-label="Deno secure runtime and bottom-layer AI infrastructure article cover">
  <defs>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito Variable";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="0.58" stop-color="#edfaff" />
      <stop offset="1" stop-color="#f5f2e9" />
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#8ac9d8" stroke-width="1" opacity="0.16" />
    </pattern>
  </defs>

  <rect width="2350" height="1000" fill="url(#paper)" />
  <rect width="2350" height="1000" fill="url(#grid)" />

  <!-- 左侧文案区 -->
  <g transform="translate(170 158)">
    <rect x="0" y="0" width="218" height="58" rx="0" fill="#0b2533" />
    <text x="109" y="39" text-anchor="middle" fill="#ffffff"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="28"
      letter-spacing="0">DENO 2.x</text>

    <text x="0" y="190" fill="#0b2533" font-weight="900"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="118"
      letter-spacing="0">Deno 没有掉队</text>
    <text x="0" y="306" fill="#12313d" font-weight="800"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="72"
      letter-spacing="0">它押注了更底层的 AI 基建</text>
    <text x="2" y="386" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="34"
      letter-spacing="0">secure runtime · Node/npm compatibility · agent firewall</text>
  </g>

  <!-- 左下角命令行卡片 -->
  <g transform="translate(170 704)">
    <rect x="0" y="0" width="1024" height="128" rx="26" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2" />
    <text x="42" y="53" fill="#007d9c"
      font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="30"
      letter-spacing="0">deno run --allow-net=api.example.com main.ts</text>
    <text x="42" y="92" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="25"
      letter-spacing="0">AI agents need external policy boundaries, not just better prompts</text>
  </g>

  <!-- 右侧：嵌套权限边界 + Deno 内核 -->
  <g>
    <rect x="1385" y="160" width="690" height="690" rx="28" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2" />
    <rect x="1465" y="240" width="530" height="530" rx="24" fill="#f8fdff" stroke="#8ac9d8"
      stroke-width="2" />
    <rect x="1550" y="325" width="360" height="360" rx="20" fill="#ffffff" stroke="#00add8"
      stroke-width="2" />
    <rect x="1642" y="417" width="176" height="176" rx="22" fill="#0b2533" />
    <g transform="translate(1675 450) scale(4.5833)">
      <path fill="#ffffff"
        d="M1.105 18.02A11.9 11.9 0 0 1 0 12.985q0-.698.078-1.376a12 12 0 0 1 .231-1.34A12 12 0 0 1 4.025 4.02a12 12 0 0 1 5.46-2.771 12 12 0 0 1 3.428-.23c1.452.112 2.825.477 4.077 1.05a12 12 0 0 1 2.78 1.774 12.02 12.02 0 0 1 4.053 7.078A12 12 0 0 1 24 12.985q0 .454-.036.914a12 12 0 0 1-.728 3.305 12 12 0 0 1-2.38 3.875c-1.33 1.357-3.02 1.962-4.43 1.936a4.4 4.4 0 0 1-2.724-1.024c-.99-.853-1.391-1.83-1.53-2.919a5 5 0 0 1 .128-1.518c.105-.38.37-1.116.76-1.437-.455-.197-1.04-.624-1.226-.829-.045-.05-.04-.13 0-.183a.155.155 0 0 1 .177-.053c.392.134.869.267 1.372.35.66.111 1.484.25 2.317.292 2.03.1 4.153-.813 4.812-2.627s.403-3.609-1.96-4.685-3.454-2.356-5.363-3.128c-1.247-.505-2.636-.205-4.06.582-3.838 2.121-7.277 8.822-5.69 15.032a.191.191 0 0 1-.315.19 12 12 0 0 1-1.25-1.634 12 12 0 0 1-.769-1.404M11.57 6.087c.649-.051 1.214.501 1.31 1.236.13.979-.228 1.99-1.41 2.013-1.01.02-1.315-.997-1.248-1.614.066-.616.574-1.575 1.35-1.635" />
    </g>

    <!-- 网络边界：地球 -->
    <rect x="1697" y="127" width="66" height="66" rx="16" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2" />
    <circle cx="1730" cy="160" r="13" fill="none" stroke="#00add8" stroke-width="2.6" />
    <ellipse cx="1730" cy="160" rx="6" ry="13" fill="none" stroke="#00add8" stroke-width="2.2" />
    <line x1="1717" y1="160" x2="1743" y2="160" stroke="#00add8" stroke-width="2.2" />

    <!-- 文件边界：文件夹 -->
    <rect x="1697" y="207" width="66" height="66" rx="16" fill="#ffffff" stroke="#8ac9d8"
      stroke-width="2" />
    <path d="M1716 231h8.5a2 2 0 0 1 1.5.7l1.8 2.3h15.2a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2h-27a2 2 0 0 1-2-2v-18a2 2 0 0 1 2-2z"
      fill="none" stroke="#12c7b8" stroke-width="2.4" />
    <line x1="1716" y1="240" x2="1744" y2="240" stroke="#12c7b8" stroke-width="2.4" />

    <!-- 执行边界：终端 -->
    <rect x="1697" y="292" width="66" height="66" rx="16" fill="#ffffff" stroke="#00add8"
      stroke-width="2" />
    <rect x="1713" y="309" width="34" height="30" rx="6" fill="none" stroke="#0b2533" stroke-width="2.4" />
    <path d="M1721 318l5 5-5 5" fill="none" stroke="#0b2533" stroke-width="2.4" stroke-linecap="round"
      stroke-linejoin="round" />
    <line x1="1732" y1="328" x2="1741" y2="328" stroke="#0b2533" stroke-width="2.4"
      stroke-linecap="round" />

    <!-- 策略检查点：盾牌 -->
    <rect x="2042" y="472" width="66" height="66" rx="16" fill="#ffffff" stroke="#f6b73c"
      stroke-width="2" />
    <path d="M2075 490l13 5.2v9.6c0 9.2-5.6 15.2-13 18.2-7.4-3-13-9-13-18.2v-9.6z"
      fill="none" stroke="#f6b73c" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M2069.5 506.5l4 4 7.5-8" fill="none" stroke="#f6b73c" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
