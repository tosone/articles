<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="374" viewBox="0 0 1740 374" role="img"
  aria-label="deno runtime choice table">
  <foreignObject width="1740" height="374">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1740px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 600px; }
        col:nth-child(2) { width: 320px; }
        col:nth-child(3) { width: 820px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>场景</th>
            <th>更自然的选择</th>
            <th>原因</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>大量既有 Node 服务，依赖复杂，稳定性优先</td>
            <td>Node.js</td>
            <td>生态最成熟，线上行为最可预测，招聘和排障成本最低。</td>
          </tr>
          <tr>
            <td>本地开发、测试、脚本、前端工具链追求速度</td>
            <td>Bun</td>
            <td>安装、运行、测试、打包体验激进，反馈快，社区声量强。</td>
          </tr>
          <tr>
            <td>边缘函数、脚本自动化、内部平台、受限执行环境</td>
            <td>Deno</td>
            <td>权限模型、标准 API、内置工具链和 Deploy/Sandbox 路线更匹配。</td>
          </tr>
          <tr>
            <td>AI Agent 需要访问生产系统</td>
            <td>Deno 生态值得重点观察</td>
            <td>Claw Patrol 这类外部策略层，比只在 prompt 里约束 Agent 更可靠。</td>
          </tr>
          <tr>
            <td>桌面应用但团队只熟 TypeScript</td>
            <td>Deno Desktop 可试点</td>
            <td>仍处实验期，但对内部工具和轻量桌面应用有吸引力。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
