<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="281" viewBox="0 0 1150 281" role="img"
  aria-label="llm china phases table">
  <foreignObject width="1150" height="281">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1150px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 220px; }
        col:nth-child(2) { width: 190px; }
        col:nth-child(3) { width: 740px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>阶段</th>
            <th>时间</th>
            <th>特征</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>追赶期</td>
            <td>2023</td>
            <td>大厂和创业公司密集发布通用大模型。</td>
          </tr>
          <tr>
            <td>应用期</td>
            <td>2024</td>
            <td>长上下文、办公、搜索、客服、教育、代码等场景落地。</td>
          </tr>
          <tr>
            <td>成本与开源期</td>
            <td>2025-2026</td>
            <td>DeepSeek、Qwen、GLM 等推动开源、低成本推理和私有化部署。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
