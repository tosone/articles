<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1000" viewBox="0 0 2350 1000"
  role="img" aria-label="large language model evolution article cover">
  <defs>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
      @font-face {
        font-family: "Nunito Variable";
        src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 1000;
        font-style: normal;
      }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="0.58" stop-color="#edfaff" />
      <stop offset="1" stop-color="#f5f2e9" />
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#8ac9d8" stroke-width="1" opacity="0.16" />
    </pattern>
  </defs>

  <rect width="2350" height="1000" fill="url(#paper)" />
  <rect width="2350" height="1000" fill="url(#grid)" />

  <!-- 左侧文案区 -->
  <g transform="translate(170 158)">
    <rect x="0" y="0" width="262" height="58" rx="0" fill="#0b2533" />
    <text x="131" y="39" text-anchor="middle" fill="#ffffff"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="28"
      letter-spacing="0">AI HISTORY</text>

    <text x="0" y="188" fill="#0b2533" font-weight="900"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="112"
      letter-spacing="0">大模型进化史</text>
    <text x="0" y="304" fill="#12313d" font-weight="800"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="62"
      letter-spacing="0">从 Transformer 到 Agentic Engineering</text>
    <text x="2" y="384" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="34"
      letter-spacing="0">context · tools · evaluation · rollback · human-in-the-loop</text>
  </g>

  <!-- 左下角工程方法卡片 -->
  <g transform="translate(170 704)">
    <rect x="0" y="0" width="1038" height="128" rx="26" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2" />
    <text x="42" y="53" fill="#007d9c"
      font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="30"
      letter-spacing="0">prompt -&gt; context -&gt; spec -&gt; agentic engineering</text>
    <text x="42" y="92" fill="#5b6f79"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="25"
      letter-spacing="0">from model capability to engineering discipline</text>
  </g>

  <!-- 右侧：能力阶梯（2017 → 2026） -->
  <g>
    <line x1="1480" y1="780" x2="2092" y2="780" stroke="#cfeaf2" stroke-width="2" />

    <rect x="1480" y="640" width="92" height="140" rx="18" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2.5" />
    <rect x="1610" y="540" width="92" height="240" rx="18" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2.5" />
    <rect x="1740" y="440" width="92" height="340" rx="18" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2.5" />
    <rect x="1870" y="340" width="92" height="440" rx="18" fill="#ffffff" stroke="#b7e8f2"
      stroke-width="2.5" />
    <rect x="2000" y="220" width="92" height="560" rx="18" fill="#0b2533" />

    <polyline points="1526,640 1656,540 1786,440 1916,340 2046,220" fill="none" stroke="#8ac9d8"
      stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="1526" cy="640" r="10" fill="#ffffff" stroke="#00add8" stroke-width="3" />
    <circle cx="1656" cy="540" r="10" fill="#ffffff" stroke="#00add8" stroke-width="3" />
    <circle cx="1786" cy="440" r="10" fill="#ffffff" stroke="#00add8" stroke-width="3" />
    <circle cx="1916" cy="340" r="10" fill="#ffffff" stroke="#00add8" stroke-width="3" />
    <circle cx="2046" cy="220" r="14" fill="#f6b73c" />

    <g fill="#a1a1aa"
      font-family="Nunito, Nunito Variable, Avenir Next, Inter, Helvetica Neue, PingFang SC, sans-serif" font-size="24"
      text-anchor="middle" letter-spacing="0">
      <text x="1526" y="824">2017</text>
      <text x="1656" y="824">2020</text>
      <text x="1786" y="824">2022</text>
      <text x="1916" y="824">2024</text>
      <text x="2046" y="824">2026</text>
    </g>
  </g>
</svg>
