<svg xmlns="http://www.w3.org/2000/svg" width="920" height="374" viewBox="0 0 920 374" role="img"
  aria-label="llm agentic engineering table">
  <foreignObject width="920" height="374">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 920px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 200px; }
        col:nth-child(2) { width: 720px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>部分</th>
            <th>要解决的问题</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>目标定义</td>
            <td>模型到底要完成什么，不完成什么。</td>
          </tr>
          <tr>
            <td>上下文管理</td>
            <td>模型能看到哪些文件、文档、日志和历史决策。</td>
          </tr>
          <tr>
            <td>工具权限</td>
            <td>模型能调用哪些工具，能否写文件、执行命令、访问网络。</td>
          </tr>
          <tr>
            <td>过程观测</td>
            <td>人能否看到模型做了什么、为什么这么做。</td>
          </tr>
          <tr>
            <td>验证回滚</td>
            <td>修改能否测试、审查、回滚和归责。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
