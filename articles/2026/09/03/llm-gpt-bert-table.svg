<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="188" viewBox="0 0 1440 188" role="img"
  aria-label="llm gpt bert table">
  <foreignObject width="1440" height="188">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1440px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 150px; }
        col:nth-child(2) { width: 360px; }
        col:nth-child(3) { width: 220px; }
        col:nth-child(4) { width: 300px; }
        col:nth-child(5) { width: 410px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>路线</th>
            <th>代表模型</th>
            <th>架构倾向</th>
            <th>擅长任务</th>
            <th>后续影响</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>GPT</td>
            <td>GPT-1、GPT-2、GPT-3</td>
            <td>Decoder-only</td>
            <td>生成、补全、对话</td>
            <td>走向 ChatGPT 和通用助手</td>
          </tr>
          <tr>
            <td>BERT</td>
            <td>BERT、RoBERTa 等</td>
            <td>Encoder-only</td>
            <td>分类、抽取、检索理解</td>
            <td>深入搜索、推荐、NLP 业务系统</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
