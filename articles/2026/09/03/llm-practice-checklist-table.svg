<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"
  aria-label="llm practice checklist table">
  <foreignObject width="1120" height="560">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1120px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 180px; }
        col:nth-child(2) { width: 940px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>关注点</th>
            <th>建议</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>模型选择</td>
            <td>不要只看榜单，按任务、上下文长度、成本、延迟、部署边界和工具能力选。</td>
          </tr>
          <tr>
            <td>RAG</td>
            <td>不要把向量库当万能解法，先管理文档质量、权限、更新和评估集。</td>
          </tr>
          <tr>
            <td>AI 编程</td>
            <td>不要只让模型“改一下”，给它目标、上下文、约束和验收标准。</td>
          </tr>
          <tr>
            <td>Agent</td>
            <td>不要默认授予写文件、执行命令、访问网络和生产系统权限。</td>
          </tr>
          <tr>
            <td>评估</td>
            <td>为关键任务建立样例集、回归测试和人工抽检机制。</td>
          </tr>
          <tr>
            <td>成本</td>
            <td>区分训练成本、推理成本、上下文成本和失败重试成本。</td>
          </tr>
          <tr>
            <td>安全</td>
            <td>把提示词、上下文、工具调用、凭证和日志都纳入安全边界。</td>
          </tr>
          <tr>
            <td>组织协作</td>
            <td>把 spec、review、测试、回滚流程前置，不要让模型绕过工程纪律。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
