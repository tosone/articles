<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="188" viewBox="0 0 1060 188" role="img"
  aria-label="llm prompt context table">
  <foreignObject width="1060" height="188">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1060px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 23px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 14px 18px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 340px; }
        col:nth-child(2) { width: 200px; }
        col:nth-child(3) { width: 520px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>方法</th>
            <th>关注点</th>
            <th>典型问题</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Prompt Engineering</td>
            <td>怎么问</td>
            <td>这个 prompt 能不能让模型给出好答案？</td>
          </tr>
          <tr>
            <td>Context Engineering</td>
            <td>给什么上下文</td>
            <td>模型有没有看到足够、正确、不过量的信息？</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
