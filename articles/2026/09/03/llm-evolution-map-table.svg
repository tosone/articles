<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="450" viewBox="0 0 1760 450" role="img"
  aria-label="llm evolution map table">
  <foreignObject width="1760" height="450">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; }
        table {
          width: 1760px;
          border-collapse: separate;
          border-spacing: 0;
          table-layout: fixed;
          font-family: "PingFang SC", "Avenir Next", "Helvetica Neue", sans-serif;
          font-size: 22px;
          line-height: 1.35;
          color: #0b2533;
          letter-spacing: 0;
          word-break: normal;
          overflow-wrap: break-word;
          line-break: strict;
        }
        th, td {
          border-right: 1px solid #d5eef4;
          border-bottom: 1px solid #d5eef4;
          padding: 12px 16px;
          text-align: left;
          vertical-align: middle;
          font-weight: 400;
        }
        th {
          background: #00add8;
          color: #ffffff;
        }
        td {
          background: #ffffff;
        }
        col:nth-child(1) { width: 160px; }
        col:nth-child(2) { width: 180px; }
        col:nth-child(3) { width: 470px; }
        col:nth-child(4) { width: 330px; }
        col:nth-child(5) { width: 410px; }
        col:nth-child(6) { width: 210px; }
        code {
          font-family: "Consolas", "SFMono-Regular", "Menlo", monospace;
          font-size: 0.92em;
          background: #f1fbfd;
          color: #0b2533;
          padding: 0 5px;
        }
      </style>
      <table>
        <colgroup>
          <col />
          <col />
          <col />
          <col />
          <col />
          <col />
        </colgroup>
        <thead>
          <tr>
            <th>阶段</th>
            <th>时间</th>
            <th>代表事件</th>
            <th>模型能力</th>
            <th>工程方法</th>
            <th>公众感知</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>奠基期</td>
            <td>2017-2019</td>
            <td>Transformer、GPT-1、BERT、GPT-2</td>
            <td>上下文表示、文本生成</td>
            <td>预训练+微调</td>
            <td>学术圈关注</td>
          </tr>
          <tr>
            <td>规模突破</td>
            <td>2020-2021</td>
            <td>GPT-3、Codex、Copilot</td>
            <td>few-shot、代码生成</td>
            <td>Prompt Engineering</td>
            <td>开发者震动</td>
          </tr>
          <tr>
            <td>产品爆发</td>
            <td>2022</td>
            <td>InstructGPT、CoT、ChatGPT</td>
            <td>指令遵循、对话推理</td>
            <td>RLHF、提示词工作流</td>
            <td>全民破圈</td>
          </tr>
          <tr>
            <td>平台竞争</td>
            <td>2023</td>
            <td>GPT-4、Claude、Gemini、LLaMA</td>
            <td>专业能力、多模态、开源可用</td>
            <td>RAG、插件、API 平台</td>
            <td>企业战略化</td>
          </tr>
          <tr>
            <td>深水区</td>
            <td>2024</td>
            <td>GPT-4o、o1、Claude 3.5、长上下文</td>
            <td>实时多模态、推理模型</td>
            <td>Context Engineering</td>
            <td>从新奇到挑剔</td>
          </tr>
          <tr>
            <td>成本革命</td>
            <td>2025</td>
            <td>DeepSeek-R1、开源推理模型、MCP</td>
            <td>低成本推理、工具使用</td>
            <td>Vibe Coding、Agentic Coding</td>
            <td>AI 能力商品化</td>
          </tr>
          <tr>
            <td>建制化</td>
            <td>2026</td>
            <td>Agent 工作流、Spec Coding</td>
            <td>长任务协作</td>
            <td>Agentic Engineering</td>
            <td>AI 成为组织能力</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
