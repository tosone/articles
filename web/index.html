<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Articles</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito@latest/index.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@latest/index.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar" aria-label="Article list">
        <header class="brand">
          <p>Engineering Notes</p>
          <h1>Articles</h1>
        </header>
        <nav id="article-list" class="article-list"></nav>
      </aside>

      <section class="reader" aria-live="polite">
        <div id="cover-wrap" class="cover-wrap"></div>
        <article id="content" class="markdown markdown-body">
          <p class="loading">Loading article...</p>
        </article>
      </section>
    </main>

    <script src="./index.js" defer></script>
  </body>
</html>
