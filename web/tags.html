<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tags - Articles</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito@latest/index.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@latest/index.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="tag-page">
      <header class="tag-header">
        <a class="back-link" href="./index.html">Articles</a>
        <div>
          <p>Tag Index</p>
          <h1 id="tag-title">Tags</h1>
        </div>
      </header>

      <section class="tag-cloud-panel" aria-label="Tag cloud">
        <div id="tag-cloud" class="tag-cloud"></div>
      </section>

      <section class="tag-results" aria-live="polite">
        <div class="tag-results-head">
          <p id="tag-count">Loading articles...</p>
        </div>
        <div id="tag-articles" class="tag-article-grid"></div>
      </section>
    </main>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
      defer
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.7/d3.layout.cloud.min.js"
      defer
    ></script>
    <script src="./tags.js" defer></script>
  </body>
</html>
